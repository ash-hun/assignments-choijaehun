<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 평가 대시보드</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
    --cum: #2f5d9e; --band: rgba(47, 93, 158, 0.16); --window: #c46a1f; --base: #3d8b5a; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ececea; --muted: #a1a19b; --line: #34342f;
      --cum: #7fa7e0; --band: rgba(127, 167, 224, 0.20); --window: #e59a55; --base: #6cc08b; --warn: #f2948c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  .bar input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); min-width: 220px; }
  .bar button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card .now { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  svg { width: 100%; height: 160px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin: 8px 0 16px; }
  .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .warn { color: var(--warn); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>실시간 평가 대시보드</h1>
  <p class="sub">실제 질의마다 쌓이는 지표의 누적 평균과 95% 구간, 최근 50건 이동 평균, 같은 구성의 Gold Set 기준선. "참고값"은 검증 조건을 통과하지 못한 지표다.</p>
  <div class="bar">
    <label>API 키 <input id="key" type="password" autocomplete="off" placeholder="서버에 API_KEY가 없으면 비워 둔다"></label>
    <button id="connect" type="button">연결</button>
    <span id="status" class="sub" role="status"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <span><span class="sw" style="background: var(--cum)"></span>누적 평균</span>
    <span><span class="sw" style="background: var(--band); height: 10px"></span>95% 구간</span>
    <span><span class="sw" style="background: var(--window)"></span>최근 50건</span>
    <span><span class="sw" style="background: var(--base)"></span>Gold Set 기준선</span>
  </div>
  <div class="grid" id="grid"><p class="empty">연결하면 지표가 표시된다.</p></div>
</main>
<script>
"use strict";
const SVG = "http://www.w3.org/2000/svg";
const W = 340, H = 160, PAD = { l: 44, r: 8, t: 8, b: 20 };
let controller = null;

function el(tag, attrs, text) {
  const node = tag.startsWith("svg:") ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, String(v));
  if (text !== undefined) node.textContent = text;
  return node;
}

function fmt(value, unit) {
  if (value === null || value === undefined) return "-";
  if (unit === "rate" || unit === "score") return value.toFixed(3);
  if (unit === "ms") return Math.round(value).toLocaleString("ko-KR") + "ms";
  if (unit === "krw") return "₩" + value.toFixed(2);
  return String(value);
}

function chart(metric) {
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": metric.label });
  const pts = metric.points;
  const values = pts.flatMap(p => [p.low, p.high, p.window]).concat(metric.baseline === null ? [] : [metric.baseline]);
  let lo = Math.min(...values), hi = Math.max(...values);
  if (metric.unit === "rate" || metric.unit === "score") { lo = Math.min(0, lo); hi = Math.max(1, hi); }
  if (hi === lo) { hi = lo + 1; }
  const maxN = pts[pts.length - 1].n;
  const x = n => PAD.l + (maxN <= 1 ? 0 : (n - 1) / (maxN - 1)) * (W - PAD.l - PAD.r);
  const y = v => PAD.t + (1 - (v - lo) / (hi - lo)) * (H - PAD.t - PAD.b);
  for (const v of [lo, (lo + hi) / 2, hi]) {
    svg.append(el("svg:line", { x1: PAD.l, x2: W - PAD.r, y1: y(v), y2: y(v), stroke: "var(--line)" }));
    svg.append(el("svg:text", { x: PAD.l - 4, y: y(v) + 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)" }, fmt(v, metric.unit)));
  }
  svg.append(el("svg:text", { x: W - PAD.r, y: H - 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)" }, `n=${maxN}`));
  const band = pts.map(p => `${x(p.n)},${y(p.high)}`).concat(pts.slice().reverse().map(p => `${x(p.n)},${y(p.low)}`));
  svg.append(el("svg:polygon", { points: band.join(" "), fill: "var(--band)" }));
  if (metric.baseline !== null) {
    svg.append(el("svg:line", { x1: PAD.l, x2: W - PAD.r, y1: y(metric.baseline), y2: y(metric.baseline),
      stroke: "var(--base)", "stroke-dasharray": "4 3", "stroke-width": 1.5 }));
  }
  const line = (key, color) => el("svg:polyline", { points: pts.map(p => `${x(p.n)},${y(p[key])}`).join(" "),
    fill: "none", stroke: color, "stroke-width": 2 });
  svg.append(line("window", "var(--window)"), line("cum", "var(--cum)"));
  return svg;
}

function render(snapshot) {
  const stats = document.getElementById("stats");
  stats.replaceChildren();
  const budget = `₩${snapshot.judge_spent_krw.toFixed(0)} / ₩${snapshot.judge_limit_krw.toFixed(0)}`;
  const items = [["질의", snapshot.records], ["답한 질의", snapshot.answered], ["Judge 판정", snapshot.judged],
    ["Judge 비용 / 상한", budget], ["구성(config_id)", snapshot.config_id], ["기준선 실행", snapshot.baseline_run || "없음"]];
  for (const [k, v] of items) {
    const box = el("div", { class: "stat" });
    box.append(el("div", { class: "k" }, k), el("div", { class: "v" }, String(v)));
    stats.append(box);
  }
  if (snapshot.judge_exhausted) stats.append(el("div", { class: "stat warn" }, "Judge 예산 소진: 채점을 멈췄다. 기록은 계속 쌓인다."));
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (const metric of snapshot.metrics) {
    const card = el("section", { class: "card" });
    const title = el("h2", {}, metric.label);
    if (metric.reference) title.append(el("span", { class: "tag" }, "참고값"));
    card.append(title);
    const last = metric.points[metric.points.length - 1];
    if (!last) {
      card.append(el("p", { class: "empty" }, "아직 값이 없다"));
    } else {
      card.append(el("div", { class: "now" },
        `누적 ${fmt(last.cum, metric.unit)} [${fmt(last.low, metric.unit)}, ${fmt(last.high, metric.unit)}] · 최근 ${fmt(last.window, metric.unit)} · 기준선 ${fmt(metric.baseline, metric.unit)}`));
      card.append(chart(metric));
    }
    grid.append(card);
  }
}

async function connect() {
  if (controller) controller.abort();
  controller = new AbortController();
  const key = document.getElementById("key").value;
  try { sessionStorage.setItem("metrics_key", key); } catch (e) { /* 저장소를 못 써도 연결은 된다 */ }
  const status = document.getElementById("status");
  status.textContent = "연결 중";
  const headers = key ? { "X-API-Key": key } : {};
  try {
    // EventSource는 헤더를 실을 수 없어 fetch 스트림으로 SSE를 읽는다.
    const response = await fetch("/v1/metrics/stream", { headers, signal: controller.signal });
    if (!response.ok) { status.textContent = `연결 실패(${response.status})`; return; }
    status.textContent = "연결됨";
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const data = frame.split("\n").filter(l => l.startsWith("data: ")).map(l => l.slice(6)).join("\n");
        if (frame.startsWith("event: snapshot") && data) render(JSON.parse(data));
      }
    }
    status.textContent = "연결 끊김";
  } catch (error) {
    if (error.name !== "AbortError") status.textContent = "연결 끊김";
  }
}

document.getElementById("connect").addEventListener("click", connect);
try { document.getElementById("key").value = sessionStorage.getItem("metrics_key") || ""; } catch (e) { /* 무시 */ }
connect();
</script>
</body>
</html>
