[project]
name = "elice-rag-qa"
version = "0.1.0"
description = "문서 기반 RAG QA 서비스와 자체 Eval Harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb-client>=1.5,<1.6",
    "fastapi>=0.115,<1",
    "fastembed>=0.9,<0.10",
    "httpx>=0.27,<1",
    "numpy>=2.5,<3",
    "openai>=1.40,<3",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "qdrant-client>=1.20,<1.21",
    "rich>=13.7,<15",
    "snowballstemmer>=3,<4",
    "structlog>=24.4,<26",
    "tiktoken>=0.12,<1",
    "tokenizers>=0.23,<0.24",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=9.0.3,<10",
]
korean = [
    "kiwipiepy>=0.21,<1",
    "konlpy>=0.6,<0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

# 타입 정보를 배포하지 않거나, 이미지에 따라 설치되지 않는 의존성이다. 쓰는 곳은 text_tokenizer 한 곳이다.
[[tool.mypy.overrides]]
module = ["snowballstemmer", "konlpy.*", "kiwipiepy"]
ignore_missing_imports = true
