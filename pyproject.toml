[project]
name = "elice-rag-qa"
version = "0.1.0"
description = "문서 기반 RAG QA 서비스와 자체 Eval Harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1.40,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "rich>=13.7,<15",
    "structlog>=24.4,<26",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
