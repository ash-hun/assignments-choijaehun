# 벡터 DB는 데이터베이스 선정 실험 후 하나만 운영 구성에 남기고, API 서버는 Query 경로 구현 뒤에 추가한다.
name: elice-rag-qa

x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    LOG_FORMAT: ${LOG_FORMAT:-console}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # tiktoken 인코딩 파일을 마운트된 캐시에 받아 두어 매번 내려받지 않는다.
    TIKTOKEN_CACHE_DIR: /workspace/.cache/tiktoken

services:
  # 일회성 배치: Corpus 수집, 선정 실험, Ingest, Eval. `docker compose up`에서는 뜨지 않는다.
  batch:
    <<: *app
    build:
      context: .
      target: runtime
    image: elice-rag-qa:runtime
    profiles: [batch]
    entrypoint: ["python", "-m"]
    volumes:
      - ./data:/workspace/data
      - ./research:/workspace/research
      - ./.cache:/workspace/.cache

  # 토크나이저 선정 실험용 배치. 형태소 분석기(korean 의존성 그룹)와 JVM이 더 들어 있다.
  batch-korean:
    <<: *app
    build:
      context: .
      target: korean
    image: elice-rag-qa:korean
    profiles: [batch]
    entrypoint: ["python", "-m"]
    volumes:
      - ./data:/workspace/data
      - ./research:/workspace/research
      - ./.cache:/workspace/.cache

  # 데이터베이스 선정 실험 후보. 포트를 열지 않고 compose 내부 네트워크로만 접속한다.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: [dbbench]

  # 내부 네트워크 전용 실험 DB라 비밀번호 대신 trust 인증을 쓴다. 운영 구성에서는 쓰지 않는다.
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    profiles: [dbbench]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  chroma:
    image: chromadb/chroma:1.5.9
    profiles: [dbbench]

  # 테스트와 타입 검사. 외부 API는 mock이라 네트워크와 .env가 필요 없다.
  dev:
    build:
      context: .
      target: dev
    image: elice-rag-qa:dev
    profiles: [dev]
    network_mode: none
    volumes:
      - ./app:/workspace/app:ro
      - ./tests:/workspace/tests:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
