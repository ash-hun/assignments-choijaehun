# 운영 구성은 qdrant, evaldb, api다. batch, batch-korean, dev와 선정 실험 후보 DB는 profile로 묶어 `docker compose up`에서 뜨지 않는다.
name: elice-rag-qa

x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    LOG_FORMAT: ${LOG_FORMAT:-console}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # tiktoken 인코딩 파일을 마운트된 캐시에 받아 두어 매번 내려받지 않는다.
    TIKTOKEN_CACHE_DIR: /workspace/.cache/tiktoken

services:
  # 일회성 배치: Corpus 수집, 선정 실험, Ingest, Eval. `docker compose up`에서는 뜨지 않는다.
  batch:
    <<: *app
    build:
      context: .
      target: runtime
    image: elice-rag-qa:runtime
    profiles: [batch]
    entrypoint: ["python", "-m"]
    volumes:
      - ./data:/workspace/data
      - ./research:/workspace/research
      - ./.cache:/workspace/.cache
      - ./configs:/workspace/configs:ro
      - ./reports:/workspace/reports

  # 토크나이저 선정 실험용 배치. 형태소 분석기(korean 의존성 그룹)와 JVM이 더 들어 있다.
  batch-korean:
    <<: *app
    build:
      context: .
      target: korean
    image: elice-rag-qa:korean
    profiles: [batch]
    entrypoint: ["python", "-m"]
    volumes:
      - ./data:/workspace/data
      - ./research:/workspace/research
      - ./.cache:/workspace/.cache

  # Query API 서버. 호스트의 localhost에만 포트를 연다(API_KEY 없이 외부에 노출되면 누구나 크레딧을 쓴다).
  api:
    <<: *app
    build:
      context: .
      target: runtime
    image: elice-rag-qa:runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.cache:/workspace/.cache
      # 질의 내역 스냅샷(make seed-export). 시작할 때 평가 저장소에 없는 행만 넣는다.
      - ./data/seed:/workspace/data/seed:ro
    # evaldb는 실시간 평가용이다. 연결하지 못해도 api는 평가만 끄고 뜬다.
    depends_on:
      - qdrant
      - evaldb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  # 선정된 벡터 DB. 포트를 열지 않고 compose 내부 네트워크로만 접속한다. 색인은 named volume에 남는다.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage

  # 평가 기록 저장소. Gold Set 평가와 실시간 질의의 기록을 남긴다. 포트를 열지 않고 compose 내부 네트워크로만 접속한다.
  # 비밀번호는 .env의 EVAL_DB_PASSWORD로만 받는다. 비어 있으면 postgres 이미지가 기동을 거부한다.
  evaldb:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_DB: eval
      POSTGRES_PASSWORD: ${EVAL_DB_PASSWORD:-}
    volumes:
      - eval_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eval", "-d", "eval"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 데이터베이스 선정 실험 후보. 내부 네트워크 전용 실험 DB라 비밀번호 대신 trust 인증을 쓴다. 운영 구성에서는 쓰지 않는다.
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    profiles: [dbbench]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  chroma:
    image: chromadb/chroma:1.5.9
    profiles: [dbbench]

  # 테스트와 타입 검사. 외부 API는 mock이라 네트워크와 .env가 필요 없다.
  dev:
    build:
      context: .
      target: dev
    image: elice-rag-qa:dev
    profiles: [dev]
    network_mode: none
    volumes:
      - ./app:/workspace/app:ro
      - ./tests:/workspace/tests:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro

volumes:
  qdrant_data:
  eval_data:
